<dialog #dialog class="modal" aria-labelledby="employee-form-title" (close)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="modal-head">
      <h2 id="employee-form-title">{{ employee() ? 'Edit employee' : 'Add employee' }}</h2>
      <button class="icon-only" type="button" aria-label="Close" (click)="close()"><app-icon name="x" /></button>
    </div>

    <div class="modal-body">
      @if (error(); as message) {
        <p class="alert" role="alert"><app-icon name="alert" /> {{ message }}</p>
      }

      <div class="form-grid">
        <label class="field" [class.invalid]="errorFor('firstName')">
          <span>First name</span>
          <input formControlName="firstName" autocomplete="given-name" />
          @if (errorFor('firstName'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('lastName')">
          <span>Last name</span>
          <input formControlName="lastName" autocomplete="family-name" />
          @if (errorFor('lastName'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('email')">
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="off" />
          @if (errorFor('email'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('phone')">
          <span>Phone</span>
          <input type="tel" inputmode="numeric" formControlName="phone" />
          @if (errorFor('phone'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('gender')">
          <span>Gender</span>
          <select formControlName="gender">
            <option value="" disabled>Select…</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
          @if (errorFor('gender'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('dateOfBirth')">
          <span>Date of birth</span>
          <input type="date" formControlName="dateOfBirth" [max]="today" />
          @if (errorFor('dateOfBirth'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('departmentId')">
          <span>Department</span>
          <select formControlName="departmentId">
            <option [ngValue]="0" disabled>Select…</option>
            @for (d of departments(); track d.id) {
              <option [ngValue]="d.id">{{ d.name }}{{ d.detail ? ' · ' + d.detail : '' }}</option>
            }
          </select>
          @if (errorFor('departmentId'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('designationId')">
          <span>Designation</span>
          <select formControlName="designationId">
            <option [ngValue]="0" disabled>Select…</option>
            @for (d of designations(); track d.id) {
              <option [ngValue]="d.id">{{ d.name }}{{ d.detail ? ' (' + d.detail + ')' : '' }}</option>
            }
          </select>
          @if (errorFor('designationId'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('salary')">
          <span>Salary (₹)</span>
          <input type="number" min="0" step="0.01" formControlName="salary" />
          @if (errorFor('salary'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <label class="field" [class.invalid]="errorFor('hireDate')">
          <span>Hire date</span>
          <input type="date" formControlName="hireDate" [max]="today" />
          @if (errorFor('hireDate'); as e) { <small class="error">{{ e }}</small> }
        </label>

        <ng-container formGroupName="address">
          <label class="field full">
            <span>Address</span>
            <input formControlName="line" autocomplete="street-address" />
          </label>
          <label class="field">
            <span>City</span>
            <input formControlName="city" />
          </label>
          <label class="field">
            <span>State</span>
            <input formControlName="state" />
          </label>
          <label class="field" [class.invalid]="errorFor('address.pincode')">
            <span>PIN code</span>
            <input formControlName="pincode" />
            @if (errorFor('address.pincode'); as e) { <small class="error">{{ e }}</small> }
          </label>
          <label class="field">
            <span>Country</span>
            <input formControlName="country" />
          </label>
        </ng-container>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn" type="button" (click)="close()">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Saving…' : employee() ? 'Save changes' : 'Add employee' }}
      </button>
    </div>
  </form>
</dialog>

<app-sidebar class="sidebar" [class.open]="navOpen()" [user]="user() ?? undefined" (navigated)="navOpen.set(false)" />

@if (navOpen()) {
  <button class="scrim" type="button" aria-label="Close navigation" (click)="navOpen.set(false)"></button>
}

<div class="content">
  <app-topbar [user]="user() ?? undefined" (menuClicked)="navOpen.set(true)" (logoutClicked)="logout()" />
  <main>
    <router-outlet />
  </main>
</div>
